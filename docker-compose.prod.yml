version: "3.9"

services:
  # ── Core Data Layer ──────────────────────────────────────────────────────────
  aegis-redis:
    image: redis:7-alpine
    container_name: aegis-redis-prod
    command: redis-server --appendonly yes --save 60 1 --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - aegis-net

  aegis-db:
    image: timescale/timescaledb:latest-pg15
    container_name: aegis-db-prod
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-12345678}
      POSTGRES_DB: Aegis_DB
    ports:
      - "5432:5432"
    volumes:
      - pg_prod_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    networks:
      - aegis-net

  # ── Intelligence Layer (Fail-Closed Architecture) ──────────────────────────
  ml-insurance-service:
    build:
      context: ./ml-services/ml-insurance-service
      dockerfile: Dockerfile
    container_name: aegis-ml-brain
    environment:
      - REDIS_URL=redis://aegis-redis:6379/0
      - ML_SERVICE_PORT=8000
    depends_on:
      - aegis-redis
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - aegis-net

  fraud-feature-service:
    build:
      context: ./ml-services/fraud-feature-service
      dockerfile: Dockerfile
    container_name: aegis-fraud-scout
    environment:
      - REDIS_URL=redis://aegis-redis:6379/0
      - FEATURE_SERVICE_PORT=8002
    depends_on:
      - aegis-redis
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    networks:
      - aegis-net

  # ── Application Layer ──────────────────────────────────────────────────────
  aegis-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis-api-gateway
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://aegis-redis:6379/0
      - DATABASE_URL=postgresql://postgres:12345678@aegis-db:5432/Aegis_DB?schema=public
      - ML_SERVICE_URL=http://ml-insurance-service:8000
    depends_on:
      - aegis-db
      - aegis-redis
      - ml-insurance-service
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - aegis-net

networks:
  aegis-net:
    driver: bridge

volumes:
  redis_prod_data:
  pg_prod_data:
