version: "3.9"

services:

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: aegis-zookeeper-1
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka
    container_name: aegis-kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CREATE_TOPICS: "aegis-events:1:1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # 🔥 REQUIRED FIX
    depends_on:
      - zookeeper

  redis:
    image: redis:alpine
    container_name: aegis-redis-1
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: aegis-timescaledb-1
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: RideSafe_AI

volumes:
  redis_data:

