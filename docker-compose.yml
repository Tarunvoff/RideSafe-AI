version: "3.9"

# =============================================================================
# RideSafe-AI (Aegis) Full Docker Deployment
# Initializes: Infra (Kafka/Redis/PG) + 4 ML Services + Backend
# =============================================================================

networks:
  aegis-net:
    driver: bridge
    name: aegis-net   # explicit name so ML compose stacks can join with external: true

services:

  # ── INFRASTRUCTURE ─────────────────────────────────────────────────────────

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper
    restart: always
    ports:
      - "2181:2181"
    networks:
      - aegis-net

  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CREATE_TOPICS: "aegis-events:1:1,driver_telemetry:1:1,zone_state_updates:1:1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - zookeeper
    networks:
      - aegis-net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - aegis-net

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    restart: always
    ports:
      - "5433:5432" # Maps port 5433 on EC2 to PostgreSQL
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: RideSafe_AI
    volumes:
      - timescale_data:/var/lib/postgresql/data
    networks:
      - aegis-net


  # ── ML MICROSERVICES ───────────────────────────────────────────────────────

  ml-insurance:
    build:
      context: ./ml-calcultion/ml-insurance-service
      dockerfile: Dockerfile
    container_name: ml-insurance
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./ml-calcultion/.env
    depends_on:
      - redis
    networks:
      - aegis-net

  fraud-feature:
    build:
      context: ./ml-calcultion/fraud-feature-service
      dockerfile: Dockerfile
    container_name: fraud-feature
    restart: always
    ports:
      - "8002:8002"
    env_file:
      - ./ml-calcultion/.env
    depends_on:
      - redis
    networks:
      - aegis-net

  grid-event:
    build:
      context: ./ml-calcultion/grid-event-service
      dockerfile: Dockerfile
    container_name: grid-event
    restart: always
    ports:
      - "8003:8003"
    env_file:
      - ./ml-calcultion/.env
    command: >
      sh -c "sleep 25 && uvicorn main:app --host 0.0.0.0 --port 8003"
    depends_on:
      - kafka
      - redis
      - ml-insurance
    networks:
      - aegis-net

  h3-feature:
    build:
      context: ./ml-calcultion/h3-feature-service
      dockerfile: Dockerfile
    container_name: h3-feature
    restart: always
    ports:
      - "8004:8004"
    env_file:
      - ./ml-calcultion/.env
    command: >
      sh -c "sleep 25 && uvicorn main:app --host 0.0.0.0 --port 8004"
    depends_on:
      - kafka
      - redis
      - ml-insurance
    networks:
      - aegis-net


  # ── BACKEND ORCHESTRATOR ───────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    depends_on:
      - timescaledb
      - redis
      - kafka
      - ml-insurance
      - fraud-feature
    networks:
      - aegis-net

volumes:
  redis_data:
  timescale_data:
